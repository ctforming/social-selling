version: '3.8'

services:
  # Service de génération du site statique
  generator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.generator
    volumes:
      - ./pages:/app/../pages
    environment:
      - NODE_ENV=production
    networks:
      - ctforming-network
    # Ce service s'arrête après avoir généré le site
    restart: "no"

  # Service web pour servir le site statique
  web:
    build:
      context: ../..
      dockerfile: site-generator/docker/Dockerfile.web
    ports:
      - "8080:80"
    volumes:
      - ../../pages:/usr/share/nginx/html
      - ../../css:/usr/share/nginx/html/css
      - ../../js:/usr/share/nginx/html/js
      - ../../images:/usr/share/nginx/html/images
      - ../../vendors:/usr/share/nginx/html/vendors
    depends_on:
      generator:
        condition: service_completed_successfully
    networks:
      - ctforming-network
    restart: unless-stopped

# Réseau dédié pour la communication entre services
networks:
  ctforming-network:
    driver: bridge

# Volumes (optionnel - décommenter si vous voulez persister les données)
# volumes:
#   static-content: